name: Preview site

# Every PR gets a real, browsable copy of the site at
#   https://saharshbarve.github.io/preview/pr-<N>/
# so changes can be reviewed as rendered pages rather than as a diff.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate
        run: ./scripts/validate.sh

      - name: Publish preview
        env:
          PR: ${{ github.event.number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          publish="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$publish"

          dest="$publish/preview/pr-$PR"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R src/. "$dest/"

          cd "$publish"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already current."
            exit 0
          fi
          git commit -m "preview: pr-$PR @ ${{ github.event.pull_request.head.sha }}"
          git push origin gh-pages

      # Idempotent: edit our own earlier comment instead of stacking a new one
      # on every push to the branch.
      - name: Comment the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://saharshbarve.github.io/preview/pr-${context.issue.number}/`;
            const marker = '<!-- site-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\n` +
              `Rendered from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. ` +
              `Pages can take a minute to pick up the change.`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
